
name: AWS Kubernetes CI-CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Docker Hub Login
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$DOCKERHUB_TOKEN" | docker login \
            -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Build Docker Image
        run: |
          set -euo pipefail
          IMAGE="mayank22447/nginx-cicd:sha-${GITHUB_SHA}"
          docker build -t "$IMAGE" .

      - name: Push Docker Image
        run: |
          set -euo pipefail
          IMAGE="mayank22447/nginx-cicd:sha-${GITHUB_SHA}"
          docker push "$IMAGE"

      - name: Deploy to AWS Kubernetes
        run: |
          set -euo pipefail

          KEY="$HOME/.ssh/master_deploy_ed25519"

          test -f "$KEY"
          chmod 600 "$KEY"

          ssh -i "$KEY" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            cicd-deploy@172.31.15.87 \
            "deploy ${GITHUB_SHA}"
